      operationId: createBroadcast
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BroadcastRequest'
      responses:
        '202':
          description: Navbatga qo'yildi
          content:
            application/json:
              schema:
                type: object
                properties:
                  queued: { type: integer, example: 143 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /admin/feature-flags:
    get:
      tags: [admin]
      summary: Feature flaglar
      description: "`paywall_enabled`, `marketplace_enabled` — deploysiz yoqish/o'chirish."
      operationId: listFeatureFlags
      x-phase: 2
      responses:
        '200':
          description: Flaglar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeatureFlag'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /admin/feature-flags/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: { type: string }
