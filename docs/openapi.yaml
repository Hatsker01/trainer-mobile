        buyer_phone: '+998901234567'
        status: new
        created_at: '2026-07-19T14:20:00Z'

    LeadCreate:
      type: object
      required: [buyer_name, buyer_phone]
      properties:
        buyer_name:  { type: string, minLength: 1, maxLength: 100, example: Aziz }
        buyer_phone: { $ref: '#/components/schemas/Phone' }

    PagedLeads:
      type: object
      required: [items, total, page, limit]
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Lead' }

    # ─────────── Fase 2: Admin ───────────

    AdminMetrics:
      type: object
      required: [trainers_total, students_total, dau, wau, signups_today, notifications_sent_today]
      properties:
        trainers_total:  { type: integer, example: 143 }
        students_total:  { type: integer, example: 2871 }
        dau:             { type: integer, example: 62 }
        wau:             { type: integer, example: 108 }
        signups_today:   { type: integer, example: 4 }
        notifications_sent_today: { type: integer, example: 512 }
        notifications_failed_today: { type: integer, example: 3 }

    AdminTrainer:
      type: object
      required: [id, name, phone, students_count, plan, is_blocked]
      properties:
        id:             { type: string, format: uuid }
        name:           { type: string, example: Sardor Rahimov }
        phone:          { $ref: '#/components/schemas/Phone' }
        students_count: { type: integer, example: 24 }
        plan:           { $ref: '#/components/schemas/Plan' }
        last_active_at: { type: string, format: date-time, nullable: true }
        is_blocked:     { type: boolean, example: false }

    PagedAdminTrainers:
      type: object
      required: [items, total, page, limit]
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/AdminTrainer' }

    BroadcastRequest:
      type: object
      required: [segment, text_uz]
      properties:
        segment:
          type: string
          enum: [all, active, passive]
          example: all
        text_uz: { type: string, example: "Yangilik: statistika bo'limi qo'shildi 💪" }
        text_ru: { type: string, nullable: true, example: "Новое: добавлен раздел статистики 💪" }

    FeatureFlag:
      type: object
      required: [key, enabled]
      properties:
        key:
          type: string
          enum: [paywall_enabled, marketplace_enabled]
          example: marketplace_enabled
        enabled:    { type: boolean, example: false }
        updated_at: { type: string, format: date-time, nullable: true }
