        status: queued
        warning: null

    # ─────────── Payment ───────────

    PaymentMethod:
      type: string
      enum: [cash, card, payme, click]
      description: Faqat yozuv uchun — to'lov integratsiyasi YO'Q (spec §2.3 S8)
      example: cash

    Payment:
      type: object
      required: [id, student_id, amount, method, paid_at, created_at]
      properties:
        id:         { type: string, format: uuid, example: a4f8c210-5b7d-4e39-8c62-1d0a9f3b7e51 }
        student_id: { type: string, format: uuid, example: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4 }
        amount:     { $ref: '#/components/schemas/Money' }
        method:     { $ref: '#/components/schemas/PaymentMethod' }
        paid_at:    { type: string, format: date, example: '2026-07-15' }
        period_from:
          type: string
          format: date
          nullable: true
          example: '2026-07-15'
        period_to:
          type: string
          format: date
          nullable: true
          description: "`monthly` da keyingi `next_due_date` shundan +1 kun"
          example: '2026-08-14'
        created_at: { type: string, format: date-time, example: '2026-07-15T11:42:00Z' }
      example:
        id: a4f8c210-5b7d-4e39-8c62-1d0a9f3b7e51
        student_id: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
        amount: 400000
        method: cash
        paid_at: '2026-07-15'
        period_from: '2026-07-15'
        period_to: '2026-08-14'
        created_at: '2026-07-15T11:42:00Z'

    PaymentCreate:
      type: object
      required: [student_id, amount, method]
      properties:
        student_id: { type: string, format: uuid, example: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4 }
        amount:     { $ref: '#/components/schemas/Money' }
        method:     { $ref: '#/components/schemas/PaymentMethod' }
        paid_at:
          type: string
          format: date
          description: "Default: bugun (Asia/Tashkent)"
          example: '2026-07-15'
        sessions_added:
          type: integer
          nullable: true
          minimum: 1
          description: "`package` tarifida qo'shiladigan mashg'ulotlar soni"
          example: null
      example:
        student_id: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
        amount: 400000
        method: cash
        paid_at: '2026-07-15'
        sessions_added: null

    PaymentCreated:
      type: object
      required: [payment, student]
      description: To'lov + qayta hisoblangan shogird holati (mobil UI darhol yangilanadi)
      properties:
        payment: { $ref: '#/components/schemas/Payment' }
        student: { $ref: '#/components/schemas/Student' }

    PagedPayments:
      type: object
      required: [items, total, page, limit]
      allOf:
        - $ref: '#/components/schemas/Pagination'
        - type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/Payment' }
      example:
        items:
          - id: a4f8c210-5b7d-4e39-8c62-1d0a9f3b7e51
            student_id: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
            amount: 400000
            method: cash
            paid_at: '2026-07-15'
            period_from: '2026-07-15'
            period_to: '2026-08-14'
            created_at: '2026-07-15T11:42:00Z'
        total: 3
        page: 1
        limit: 20

    # ─────────── Attendance ───────────

    AttendanceBulkRequest:
      type: object
      required: [date, student_ids]
      properties:
        date:
          type: string
          format: date
          description: "Asia/Tashkent bo'yicha sana"
          example: '2026-07-20'
        student_ids:
          type: array
          minItems: 1
          maxItems: 200
          items: { type: string, format: uuid }
          example:
            - 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
            - 5d2a7b91-4c8e-4a2f-b6d3-1e9f0c4a8b72
      example:
        date: '2026-07-20'
        student_ids:
          - 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
          - 5d2a7b91-4c8e-4a2f-b6d3-1e9f0c4a8b72

    AttendanceBulkResponse:
      type: object
      required: [marked, skipped]
      properties:
        marked:
          type: integer
          description: Yangi belgilanganlar soni
          example: 2
        skipped:
          type: integer
          description: Allaqachon belgilangan (idempotent)
          example: 0
        low_sessions:
          type: array
          description: "Paketda 2 yoki kam mashg'ulot qolgan shogirdlar — eslatma navbatga tushdi"
          items:
            type: object
            required: [student_id, sessions_left]
            properties:
              student_id:    { type: string, format: uuid }
              sessions_left: { type: integer }
          example:
            - student_id: 5d2a7b91-4c8e-4a2f-b6d3-1e9f0c4a8b72
              sessions_left: 2
      example:
        marked: 2
        skipped: 0
        low_sessions:
          - student_id: 5d2a7b91-4c8e-4a2f-b6d3-1e9f0c4a8b72
            sessions_left: 2

    AttendanceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: Kelgan kunlar (kalendar heatmap uchun)
          items:
            type: object
            required: [date]
            properties:
              date: { type: string, format: date }
      example:
        items:
          - date: '2026-07-18'
          - date: '2026-07-16'
          - date: '2026-07-14'

