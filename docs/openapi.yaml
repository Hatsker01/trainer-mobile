        '200':
          description: Mahsulotlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /market/products/{id}/lead:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    post:
      tags: [market]
      summary: Buyurtma (lead) yaratish
      description: |
        Biz to'lov va yetkazishga aralashmaymiz — lead yaratiladi va merchantga
        Telegram xabar ketadi, qolgani ular o'rtasida (spec §4.2).
      operationId: createMarketLead
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '201':
          description: Lead yaratildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  # ═══════════════════════ FASE 2 — ADMIN ═══════════════════════

  /admin/metrics:
