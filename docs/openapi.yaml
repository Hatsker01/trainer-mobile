        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /merchant/leads/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    patch:
      tags: [merchant]
