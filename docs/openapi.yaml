    DashboardStudent:
      type: object
      description: StudentCard mini — dashboard bloklari uchun
      required: [id, name, tariff_price, payment_state]
      properties:
        id:    { type: string, format: uuid }
        name:  { type: string }
        phone: { $ref: '#/components/schemas/Phone' }
        tariff_price:  { $ref: '#/components/schemas/Money' }
        next_due_date: { type: string, format: date, nullable: true }
        days_overdue:  { type: integer, nullable: true }
        payment_state: { $ref: '#/components/schemas/PaymentState' }
        tg_connected:  { type: boolean }

    DashboardResponse:
      type: object
      required: [date, greeting_name, due_today, due_soon, overdue, attendance_today]
      properties:
        date:
          type: string
          format: date
          description: "Bugungi sana, Asia/Tashkent"
          example: '2026-07-20'
        greeting_name: { type: string, example: Sardor }
        due_today:
          type: array
          items: { $ref: '#/components/schemas/DashboardStudent' }
        due_soon:
          type: array
          description: 3 kun ichida to'lov kutilayotganlar
          items: { $ref: '#/components/schemas/DashboardStudent' }
        overdue:
          type: array
          description: Muddati o'tganlar
          items: { $ref: '#/components/schemas/DashboardStudent' }
        totals:
          type: object
          properties:
            due_today_amount: { $ref: '#/components/schemas/Money' }
            overdue_amount:   { $ref: '#/components/schemas/Money' }
        attendance_today:
          type: object
          required: [marked_count]
          properties:
            marked_count: { type: integer, example: 5 }
      example:
        date: '2026-07-20'
        greeting_name: Sardor
        due_today:
          - id: 5d2a7b91-4c8e-4a2f-b6d3-1e9f0c4a8b72
            name: Nilufar Yo'ldosheva
            phone: '+998935557788'
            tariff_price: 500000
            next_due_date: '2026-07-20'
            days_overdue: 0
            payment_state: due_today
            tg_connected: true
        due_soon:
          - id: 9a1c3e5f-7b2d-4c8a-9e0f-6d4b2a8c1e73
            name: Bekzod Toshmatov
            phone: '+998971112233'
            tariff_price: 400000
            next_due_date: '2026-07-22'
            days_overdue: null
            payment_state: due_soon
            tg_connected: false
        overdue:
          - id: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
            name: Aziz Karimov
            phone: '+998901234567'
            tariff_price: 400000
            next_due_date: '2026-07-15'
            days_overdue: 5
            payment_state: overdue
            tg_connected: true
        totals:
          due_today_amount: 500000
          overdue_amount: 400000
        attendance_today:
          marked_count: 5

    StatsResponse:
      type: object
      required: [month_revenue, prev_month_revenue, active_students, debt_total, series]
      properties:
        month_revenue:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Shu oy daromadi
        prev_month_revenue: { $ref: '#/components/schemas/Money' }
        change_percent:
          type: number
          format: float
          nullable: true
          description: "O'tgan oyga nisbatan o'zgarish (%). O'tgan oy 0 bo'lsa null."
          example: 12.5
        active_students: { type: integer, example: 24 }
        debtors_count:   { type: integer, example: 3 }
        debt_total:
          allOf: [{ $ref: '#/components/schemas/Money' }]
          description: Jami qarzdorlik
        series:
          type: array
          description: Oxirgi 6 oy daromadi (eskidan yangiga)
          items:
            type: object
            required: [month, revenue]
            properties:
              month:   { type: string, description: "YYYY-MM", example: '2026-07' }
              revenue: { $ref: '#/components/schemas/Money' }
        by_tariff:
          type: array
          description: Shu oy daromadining tarif turlari kesimi
          items:
            type: object
            required: [tariff_type, students, revenue]
            properties:
              tariff_type: { $ref: '#/components/schemas/TariffType' }
              students:    { type: integer, description: Shu tarifdagi aktiv shogirdlar, example: 18 }
              revenue:     { $ref: '#/components/schemas/Money' }
      example:
        month_revenue: 9600000
        prev_month_revenue: 8533000
        change_percent: 12.5
        active_students: 24
        debtors_count: 3
        debt_total: 1200000
        by_tariff:
          - { tariff_type: monthly, students: 18, revenue: 7200000 }
          - { tariff_type: package, students: 5, revenue: 2400000 }
          - { tariff_type: single,  students: 1, revenue: 0 }
        series:
          - { month: '2026-02', revenue: 6400000 }
          - { month: '2026-03', revenue: 7200000 }
          - { month: '2026-04', revenue: 7800000 }
          - { month: '2026-05', revenue: 8100000 }
          - { month: '2026-06', revenue: 8533000 }
          - { month: '2026-07', revenue: 9600000 }

    # ─────────── Notification ───────────

    NotificationStatus:
      type: string
      enum: [queued, sent, failed]
      example: queued

    NotificationChannel:
      type: string
      enum: [tg, push, sms]
      example: tg

    RecipientType:
      type: string
      enum: [student, trainer, merchant]
      example: student

    Notification:
      type: object
      required: [id, recipient_type, recipient_id, channel, template_key, status, scheduled_at]
      properties:
        id:             { type: string, format: uuid }
        recipient_type: { $ref: '#/components/schemas/RecipientType' }
        recipient_id:   { type: string, format: uuid }
        channel:        { $ref: '#/components/schemas/NotificationChannel' }
        template_key:   { type: string, example: payment_due_3days }
        status:         { $ref: '#/components/schemas/NotificationStatus' }
        scheduled_at:   { type: string, format: date-time }
        sent_at:        { type: string, format: date-time, nullable: true }
