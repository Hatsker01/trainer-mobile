openapi: 3.0.3

info:
  title: USTOZ API
  version: 1.0.0
  description: |
    Trenerlar uchun shogird va to'lov boshqaruvi + sport nutrition marketplace.

    **Konvensiyalar**
    - Pul: `BIGINT`, **so'mda butun son** (tiyin yo'q, float yo'q).
    - Sana (`paid_at`, `next_due_date`, `date`): `YYYY-MM-DD`, timezone'siz.
    - Vaqt (`created_at`, `sent_at`): RFC3339 UTC. Biznes-logika `Asia/Tashkent`.
    - Telefon: `+998XXXXXXXXX` (13 belgi, probelsiz).
    - Hech narsa DELETE qilinmaydi — `status=archived`.
    - RBAC: trener faqat o'z shogirdlarini ko'radi (`trainer_id = ctx.user`).
    - `x-phase: 2` bilan belgilangan endpointlar MVP da 501 qaytaradi (spec §8).

    To'liq kontekst: `docs/ustoz-mvp-spec.md`
  contact:
    name: USTOZ
  license:
    name: Proprietary
    url: https://example.invalid/license

servers:
  - url: http://localhost:8080/api/v1
    description: Lokal backend
  - url: http://localhost:4010/api/v1
    description: Prism mock server (mobile oqimi uchun)
  - url: https://api.ustoz.uz/api/v1
    description: Production

tags:
  - name: auth
    description: OTP autentifikatsiya, JWT
  - name: me
    description: Joriy foydalanuvchi profili
  - name: students
    description: Shogirdlar CRUD, filtr, arxiv, eslatma
  - name: payments
    description: To'lovlar
  - name: attendance
    description: Davomad
  - name: dashboard
    description: Bugungi holat va statistika
  - name: tariffs
    description: Tarif shablonlari
  - name: telegram
    description: Bot webhook
  - name: merchant
    description: "Merchant panel (Fase 2)"
  - name: market
    description: "Marketplace (Fase 2)"
  - name: admin
    description: "Admin panel (Fase 2)"

security:
  - bearerAuth: []

paths:

  # ─────────────────────────── AUTH ───────────────────────────

  /auth/otp/request:
    post:
      tags: [auth]
      summary: OTP kod so'rash
      description: |
        Telefonga 6 raqamli kod yuboradi. Kanal: `tg_chat_id` bog'langan bo'lsa
        Telegram bot (bepul), aks holda Eskiz.uz SMS.
        Rate limit: 5 so'rov / soat / telefon (spec §7).
      operationId: requestOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpRequest'
      responses:
        '200':
          description: Kod yuborildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '502':
          description: Kod generatsiya qilindi, lekin kanalga yetkazib bo'lmadi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                send_failed:
                  value:
                    error:
                      code: otp_send_failed
                      message: Kodni yuborib bo'lmadi. Birozdan keyin urinib ko'ring

  /auth/otp/verify:
    post:
      tags: [auth]
      summary: OTP kodni tasdiqlash
      description: |
        Kod to'g'ri bo'lsa JWT juftligi qaytariladi. Telefon birinchi marta
        ko'rinsa — `users` yozuvi yaratiladi va `is_new_user: true` bo'ladi
        (mobil app profil sozlash ekraniga o'tkazadi).
      operationId: verifyOtp
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Muvaffaqiyatli kirish
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Kod noto'g'ri yoki muddati o'tgan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_code:
                  value:
                    error:
                      code: otp_invalid
                      message: Kod noto'g'ri yoki muddati o'tgan
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /auth/refresh:
    post:
      tags: [auth]
      summary: Access tokenni yangilash
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Yangi juftlik
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── ME ───────────────────────────

  /me:
    get:
      tags: [me]
      summary: Joriy profil + tarif rejasi
      operationId: getMe
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [me]
      summary: Profilni yangilash
      description: Ism, zal nomi, til, eslatma vaqti. Faqat yuborilgan maydonlar o'zgaradi.
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MeUpdate'
      responses:
        '200':
          description: Yangilangan profil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/tg-link:
    get:
      tags: [me]
      summary: Trenerni Telegram'ga ulash havolasi
      description: |
        Mobil ilovadagi "Telegram ulash" tugmasi uchun (spec §3.2).
        Havola ochilganda bot `/start trainer_<token>` oladi va trenerning
        `tg_chat_id` sini bog'laydi — shundan keyin kunlik digest va qarz
        eslatmalari botga keladi.

        Token birinchi so'rovda generatsiya qilinadi va keyin **o'zgarmaydi**:
        trener havolani saqlab qo'yib keyinroq ochishi mumkin.
      operationId: getTrainerTgLink
      responses:
        '200':
          description: Havola
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgLink'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── STUDENTS ───────────────────────────

  /students:
    get:
      tags: [students]
      summary: Shogirdlar ro'yxati
      description: |
        Default saralash: **qarzdorlar doim tepada**, keyin `next_due_date` o'sish
        tartibida. `filter=archived` berilmasa arxivlangalar chiqmaydi.
      operationId: listStudents
      parameters:
        - name: filter
          in: query
          description: Holat filtri
          schema:
            type: string
            enum: [all, debtors, upcoming, active, archived]
            default: all
        - name: q
          in: query
          description: Qidiruv — ism yoki telefon bo'yicha
          schema:
            type: string
            maxLength: 100
          example: Aziz
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Sahifalangan ro'yxat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedStudents'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [students]
      summary: Shogird qo'shish
      description: |
        Yaratilgach `invite_token` generatsiya qilinadi — mobil app deep link
        yasaydi: `t.me/UstozBot?start=<invite_token>`.
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /students/{id}:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [students]
      summary: Bitta shogird
      operationId: getStudent
      responses:
        '200':
          description: Shogird
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [students]
      summary: Shogirdni yangilash
      description: Ism, telefon, tarif o'zgartirish. Faqat yuborilgan maydonlar.
      operationId: updateStudent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentUpdate'
      responses:
        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /students/{id}/archive:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [students]
      summary: Shogirdni arxivlash
      description: |
        `status='archived'`. **DELETE yo'q** — data hech qachon yo'qolmaydi
        (spec §6.2). Idempotent: arxivlangan shogirdni qayta arxivlash 200 qaytaradi.
      operationId: archiveStudent
      responses:
        '200':
          description: Arxivlandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students/{id}/invite-link:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [students]
      summary: Shogirdni botga taklif qilish havolasi
      description: |
        `t.me/<bot>?start=<invite_token>`. Trener buni shogirdga yuboradi;
        shogird ochganda `students.tg_chat_id` bog'lanadi va u eslatmalarni
        Telegram'da oladi (spec §3.1).

        Token shogird yaratilganda generatsiya qilingan (`POST /students`) —
        bu endpoint uni faqat havola ko'rinishida qaytaradi, YANGISINI
        yaratmaydi: aks holda oldin yuborilgan havolalar ishlamay qolardi.
      operationId: getStudentInviteLink
      responses:
        '200':
          description: Havola
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TgLink'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students/{id}/remind:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [students]
      summary: Qo'lda eslatma yuborish
      description: |
        Shogirdga bot orqali eslatma. `tg_chat_id` NULL bo'lsa 422.
        Kuniga 3 tadan ortiq bo'lsa javobda `warning` qaytadi (UI ogohlantiradi,
        lekin bloklanmaydi — spec §2.4).
      operationId: remindStudent
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemindRequest'
      responses:
        '202':
          description: Eslatma navbatga qo'yildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemindResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Shogird Telegramga ulanmagan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                not_connected:
                  value:
                    error:
                      code: student_not_connected
                      message: Shogird Telegram botga ulanmagan

  /students/{id}/payments:
    parameters:
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/LimitParam'
    get:
      tags: [students, payments]
      summary: Shogirdning to'lovlar tarixi
      operationId: listStudentPayments
      responses:
        '200':
          description: To'lovlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPayments'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /students/{id}/attendance:
    parameters:
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [students, attendance]
      summary: Shogirdning davomadi
      description: Kalendar heatmap uchun. Default — oxirgi 90 kun.
      operationId: listStudentAttendance
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          example: '2026-05-01'
        - name: to
          in: query
          schema: { type: string, format: date }
          example: '2026-07-20'
      responses:
        '200':
          description: Davomad sanalari
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceList'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── PAYMENTS ───────────────────────────

  /payments:
    post:
      tags: [payments]
      summary: To'lov qo'shish
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey' 
      description: |
        Saqlangach `next_due_date` avtomatik qayta hisoblanadi:
        - `monthly` → oxirgi to'lov `period_to` + 1 kun
        - `package` → sana yo'q, `sessions_total` yangilanadi
        - `single`  → sana yo'q

        Shogirdga bot orqali chek-xabar navbatga qo'yiladi.
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentCreate'
      responses:
        '201':
          description: To'lov saqlandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentCreated'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ─────────────────────────── ATTENDANCE ───────────────────────────

  /attendance/bulk:
    post:
      tags: [attendance]
      summary: Davomadni ommaviy belgilash
      description: |
        Berilgan sanaga belgilangan shogirdlarni yozadi.
        **Idempotent** — `UNIQUE(student_id, date)`, qayta yuborish dublikat yaratmaydi.
        Paketli shogirdlarda `sessions_used` +1; 2 ta qolganda eslatma navbatga tushadi.
      operationId: bulkAttendance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceBulkRequest'
      responses:
        '200':
          description: Belgilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceBulkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ─────────────────────────── DASHBOARD / STATS ───────────────────────────

  /dashboard:
    get:
      tags: [dashboard]
      summary: Bugungi holat
      description: |
        Asosiy ekran (S4) uchun. Sanalar `Asia/Tashkent` bo'yicha hisoblanadi.
        Bloklar: `due_today`, `due_soon` (3 kun ichida), `overdue`.
      operationId: getDashboard
      responses:
        '200':
          description: Dashboard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /stats:
    get:
      tags: [dashboard]
      summary: Statistika
      description: 4 ta karta + 6 oylik daromad seriyasi (spec §2.3 S10).
      operationId: getStats
      responses:
        '200':
          description: Statistika
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─────────────────────────── TARIFFS ───────────────────────────

  /tariffs:
    get:
      tags: [tariffs]
      summary: Tarif shablonlari
      operationId: listTariffs
      parameters:
        - name: include_inactive
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Shablonlar
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TariffTemplate'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tariffs]
      summary: Tarif shabloni qo'shish
      operationId: createTariff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffCreate'
      responses:
        '201':
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffTemplate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /tariffs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    patch:
      tags: [tariffs]
      summary: Tarif shablonini yangilash
      description: |
        `is_active=false` — shablonni yashirish. Mavjud shogirdlarning tarifi
        o'zgarmaydi (tarif shogirdga nusxalanadi, havola emas).
      operationId: updateTariff
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TariffUpdate'
      responses:
        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffTemplate'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ─────────────────────────── TELEGRAM ───────────────────────────

  /tg/webhook:
    post:
      tags: [telegram]
      summary: Telegram bot updates
      description: |
        Webhook rejimi (polling emas). `X-Telegram-Bot-Api-Secret-Token` header
        tekshiriladi. Telegram qayta yubormasligi uchun **har doim 200** qaytaradi —
        xatolar ichkarida loglanadi va navbatga qo'yiladi.
      operationId: telegramWebhook
      security:
        - telegramSecret: []
      requestBody:
        required: true
        description: Telegram Update obyekti (o'zgarmagan holda)
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              example:
                update_id: 883745901
                message:
                  message_id: 12
                  from: { id: 501234567, first_name: Aziz, language_code: uz }
                  chat: { id: 501234567, type: private }
                  date: 1784620800
                  text: /start inv_8f3a9c2b1d
      responses:
        '200':
          description: Qabul qilindi
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ═══════════════════════ FASE 2 — MERCHANT ═══════════════════════

  /merchant/apply:
    post:
      tags: [merchant]
      summary: Merchant arizasi
      description: Status `pending` → admin tasdiqlaydi.
      operationId: merchantApply
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantApply'
      responses:
        '201':
          description: Ariza qabul qilindi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /merchant/products:
    get:
      tags: [merchant]
      summary: Merchant mahsulotlari
      operationId: listMerchantProducts
      x-phase: 2
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Mahsulotlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProducts'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '501': { $ref: '#/components/responses/NotImplemented' }
    post:
      tags: [merchant]
      summary: Mahsulot qo'shish
      operationId: createMerchantProduct
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        '201':
          description: Yaratildi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /merchant/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    patch:
      tags: [merchant]
      summary: Mahsulotni yangilash
      operationId: updateMerchantProduct
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /merchant/leads:
