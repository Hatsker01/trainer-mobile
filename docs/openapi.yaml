        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Trenerlar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedAdminTrainers'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /admin/merchants/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 16fd2706-8baf-433b-82eb-8c7fada847da
    patch:
      tags: [admin]
      summary: Merchant moderatsiyasi
      description: "`approved` yoki `blocked` ga o'tkazish."
      operationId: moderateMerchant
      x-phase: 2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  $ref: '#/components/schemas/MerchantStatus'
      responses:
        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    patch:
