        '200':
          description: Yangilandi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeatureFlag'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '501': { $ref: '#/components/responses/NotImplemented' }

  /admin/logs/notifications:
    get:
      tags: [admin]
      summary: Notification delivery log
      operationId: listNotificationLogs
      x-phase: 2
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/NotificationStatus'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Loglar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedNotifications'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '501': { $ref: '#/components/responses/NotImplemented' }

# ═══════════════════════════ COMPONENTS ═══════════════════════════

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Access token, 15 daqiqa. `Authorization: Bearer <access>`"
    telegramSecret:
      type: apiKey
      in: header
      name: X-Telegram-Bot-Api-Secret-Token
      description: Telegram webhook secret (spec §3.3)

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Takroriy to'lovdan himoya. Mijoz har **yangi** to'lov uchun unikal
        qiymat (masalan UUIDv4) beradi va **qayta urinishda AYNAN shu
        qiymatni** takrorlaydi.

        Server shu kalitli to'lov allaqachon yozilgan bo'lsa, yangisini
        yaratmaydi — **birinchi to'lovning aynan o'zini** qaytaradi
        (status ham `201`, ya'ni mijoz farqni sezmaydi).

        Kalitsiz so'rov ham qabul qilinadi, lekin u holda tarmoq
        qayta urinishi ikkinchi to'lovni yaratishi mumkin.

        Amal qilish doirasi: bitta trener. Kalit 1–255 belgi.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

    StudentId:
      name: id
      in: path
      required: true
      description: Shogird UUID
      schema: { type: string, format: uuid }
      example: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
    PageParam:
      name: page
      in: query
      description: Sahifa raqami (1 dan)
      schema: { type: integer, minimum: 1, default: 1 }
      example: 1
    LimitParam:
      name: limit
      in: query
      description: Sahifadagi elementlar soni
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20

  responses:
    BadRequest:
      description: So'rov formati noto'g'ri
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            bad_request:
              value:
                error:
                  code: bad_request
                  message: So'rov formati noto'g'ri
    Unauthorized:
      description: Token yo'q, yaroqsiz yoki muddati o'tgan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: Avtorizatsiya talab qilinadi
    Forbidden:
      description: Bu resursga huquq yo'q (masalan boshqa trenerning shogirdi)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: Bu amalga ruxsat yo'q
    NotFound:
      description: Topilmadi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            not_found:
              value:
                error:
                  code: not_found
                  message: Shogird topilmadi
    UnprocessableEntity:
      description: Validatsiya xatosi
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            validation:
              value:
                error:
                  code: validation_failed
                  message: Maydonlar to'g'ri to'ldirilmagan
                  details:
                    phone: Telefon +998XXXXXXXXX formatda bo'lishi kerak
                    tariff_price: Summa 0 dan katta bo'lishi kerak
    TooManyRequests:
      description: |
        Juda ko'p so'rov. Ikki chegara bor:
        1 kod / 60 soniya (cooldown) va 5 kod / soat / telefon (spec §7).
      headers:
        Retry-After:
          description: Necha soniyadan keyin qayta urinish mumkin
          schema: { type: integer, example: 60 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            rate_limited:
              value:
                error:
                  code: rate_limited
                  message: Juda ko'p urinish. 1 soatdan keyin qayta urinib ko'ring
    NotImplemented:
      description: "Fase 2 — hali implement qilinmagan"
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
          examples:
            not_implemented:
              value:
                error:
                  code: not_implemented
                  message: Bu endpoint hali tayyor emas

  schemas:

    # ─────────── Umumiy ───────────

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Mashina o'qiydigan xato kodi (snake_case)
          example: validation_failed
        message:
          type: string
          description: Foydalanuvchiga ko'rsatiladigan matn (so'rov `Accept-Language` tilida)
          example: Maydonlar to'g'ri to'ldirilmagan
        details:
          type: object
          description: Maydon → xato matni (faqat 422 da)
          additionalProperties: { type: string }
          example:
            phone: Telefon +998XXXXXXXXX formatda bo'lishi kerak

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error: { $ref: '#/components/schemas/Error' }

    Pagination:
      type: object
      required: [total, page, limit]
      properties:
        total: { type: integer, description: Jami elementlar soni, example: 47 }
        page:  { type: integer, example: 1 }
        limit: { type: integer, example: 20 }

    Phone:
      type: string
      description: "+998XXXXXXXXX formatda, probelsiz"
      pattern: '^\+998[0-9]{9}$'
      minLength: 13
      maxLength: 13
      example: '+998901234567'

    Lang:
      type: string
      enum: [uz, ru]
      default: uz
      example: uz

    Money:
      type: integer
      format: int64
      description: "So'mda butun son. Tiyin YO'Q, float YO'Q."
      minimum: 0
      example: 400000

    # ─────────── Auth ───────────

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
      example:
        phone: '+998901234567'

    OtpRequestResponse:
      type: object
      required: [channel, expires_in]
      properties:
        channel:
          type: string
          enum: [tg, sms]
          description: Kod qaysi kanal orqali yuborildi
          example: sms
        expires_in:
          type: integer
          description: Kod amal qilish muddati (soniya)
          example: 300
        retry_after:
          type: integer
          description: Qayta so'rashgacha kutish (soniya)
          example: 60

    OtpVerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        code:
          type: string
          pattern: '^[0-9]{6}$'
          example: '482913'
      example:
        phone: '+998901234567'
        code: '482913'

    RefreshRequest:
      type: object
      required: [refresh]
      properties:
        refresh:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyYjFmOWM0ZSJ9.rTk8

    TokenPair:
      type: object
      required: [access, refresh, expires_in]
      properties:
        access:
          type: string
          description: Access token, 15 daqiqa
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyYjFmOWM0ZSJ9.aB3d
        refresh:
          type: string
          description: Refresh token, 30 kun
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIyYjFmOWM0ZSJ9.rTk8
        expires_in:
          type: integer
          description: Access token muddati (soniya)
          example: 900
        is_new_user:
          type: boolean
          description: "true bo'lsa — profil sozlash ekraniga (S3)"
          example: false

    # ─────────── Me ───────────

    UserRole:
      type: string
      enum: [trainer, merchant, admin]
      example: trainer

    Plan:
      type: string
      enum: [free, pro]
      default: free
      example: free

    Me:
      type: object
      required: [id, phone, role, name, lang, plan, tg_connected, created_at]
      properties:
        id:    { type: string, format: uuid, example: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4 }
        phone: { $ref: '#/components/schemas/Phone' }
        role:  { $ref: '#/components/schemas/UserRole' }
        name:  { type: string, example: Sardor Rahimov }
        lang:  { $ref: '#/components/schemas/Lang' }
        gym_name:
          type: string
          nullable: true
          example: Olimp Fitness
        remind_time:
          type: string
          description: Kunlik eslatma vaqti, Asia/Tashkent (HH:MM)
          pattern: '^[0-2][0-9]:[0-5][0-9]$'
          example: '09:00'
        plan: { $ref: '#/components/schemas/Plan' }
        plan_until:
          type: string
          format: date
          nullable: true
          example: null
        tg_connected:
          type: boolean
          description: Trener botga ulanganmi
          example: true
        created_at: { type: string, format: date-time, example: '2026-03-14T06:12:00Z' }
      example:
        id: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4
        phone: '+998901234567'
        role: trainer
        name: Sardor Rahimov
        lang: uz
        gym_name: Olimp Fitness
        remind_time: '09:00'
        plan: free
        plan_until: null
        tg_connected: true
        created_at: '2026-03-14T06:12:00Z'

    MeUpdate:
      type: object
      minProperties: 1
      properties:
        name:        { type: string, minLength: 1, maxLength: 100, example: Sardor Rahimov }
        gym_name:    { type: string, nullable: true, maxLength: 100, example: Olimp Fitness }
        lang:        { $ref: '#/components/schemas/Lang' }
        remind_time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$', example: '09:00' }

    # ─────────── Tariff ───────────

    TariffType:
      type: string
      enum: [monthly, package, single]
      description: "monthly — oylik obuna · package — mashg'ulotlar paketi · single — bir martalik"
      example: monthly

    TariffTemplate:
      type: object
      required: [id, name, type, price, is_active]
      properties:
        id:   { type: string, format: uuid, example: 7c9e6679-7425-40de-944b-e07fc1f90ae7 }
        name: { type: string, example: Oylik standart }
        type: { $ref: '#/components/schemas/TariffType' }
        price: { $ref: '#/components/schemas/Money' }
        sessions_count:
          type: integer
          nullable: true
          description: "Faqat `package` uchun"
          example: null
        is_active: { type: boolean, example: true }
      example:
        id: 7c9e6679-7425-40de-944b-e07fc1f90ae7
        name: Oylik standart
        type: monthly
        price: 400000
        sessions_count: null
        is_active: true

    TariffCreate:
      type: object
      required: [name, type, price]
      properties:
        name:  { type: string, minLength: 1, maxLength: 100, example: 12 ta mashg'ulot }
        type:  { $ref: '#/components/schemas/TariffType' }
        price: { $ref: '#/components/schemas/Money' }
        sessions_count:
          type: integer
          nullable: true
          minimum: 1
          description: "`type=package` bo'lsa majburiy"
          example: 12
      example:
        name: 12 ta mashg'ulot
        type: package
        price: 600000
        sessions_count: 12

    TariffUpdate:
      type: object
      minProperties: 1
      properties:
        name:      { type: string, minLength: 1, maxLength: 100 }
        price:     { $ref: '#/components/schemas/Money' }
        is_active: { type: boolean, example: false }

    # ─────────── Student ───────────

    StudentStatus:
      type: string
      enum: [active, archived]
      example: active

    PaymentState:
      type: string
      description: |
        Hisoblangan holat (DB'da saqlanmaydi) — StatusBadge uchun:
        `paid` (TO'LANGAN) · `due_soon` (3 KUN QOLDI) · `due_today` · `overdue` (QARZDOR)
        · `none` (paket/bir martalik — sana yo'q)
      enum: [paid, due_soon, due_today, overdue, none]
      example: paid

    TgLink:
      type: object
      required: [link, token]
      properties:
        link:
          type: string
          description: To'liq deep link — mobil ilova buni share/copy qiladi.
          example: https://t.me/UstozBot?start=inv_8f3a9c2b1d
        token:
          type: string
          description: |
            Havoladagi `start` parametri. Mobil ilova havolani o'zi
            yasashi shart emas, lekin QR kod uchun token kerak bo'lishi mumkin.
          example: inv_8f3a9c2b1d

    Student:
      type: object
      required:
        [id, name, phone, tariff_type, tariff_price, sessions_used,
         status, payment_state, tg_connected, created_at]
      properties:
        id:    { type: string, format: uuid, example: 2b1f9c4e-6a3d-4f8b-9e11-77c0a5d2e3f4 }
        name:  { type: string, example: Aziz Karimov }
        phone: { $ref: '#/components/schemas/Phone' }
        tariff_type:  { $ref: '#/components/schemas/TariffType' }
        tariff_price: { $ref: '#/components/schemas/Money' }
